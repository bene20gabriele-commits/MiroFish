# Pubblica il Monte Carlo Trading Simulator su GitHub Pages.
# Usa il metodo ufficiale GitHub Actions con auto-attivazione (enablement):
# non e' necessario impostare nulla manualmente in Settings -> Pages.
name: Deploy Monte Carlo Portal

on:
  push:
    branches:
      - claude/monte-carlo-trading-sim-6a2awi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# consente una sola pubblicazione concorrente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages (attiva se necessario)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r montecarlo/* _site/
          touch _site/.nojekyll

      - name: Carica l'artifact del sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
